plugins {
    id 'com.android.application'
}

android {
    namespace 'org.moonpool.cookieadmission'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'org.moonpool.admissionwriterorder'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.0.1-probe'
    }

    sourceSets.main.java.srcDirs += '../../build/shared'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moonpool Mock Host</title>
    <style>
      body { font: 15px/1.6 system-ui, sans-serif; margin: 0; padding: 1.5rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 0.9rem; margin: 0 0 1.25rem; }
      dt { color: #666; }
      dd { margin: 0; }
      code { font-family: ui-monospace, monospace; font-size: 0.9em; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      button { font: inherit; padding: 0.35rem 0.7rem; cursor: pointer; }
      button[aria-pressed="true"] { font-weight: 700; }
      #configuration { margin: 0.7rem 0 0; }
      .hint { color: #666; font-size: 0.85rem; margin: 0.25rem 0 0.8rem; }
      iframe { box-sizing: border-box; width: 100%; height: 28rem; border: 1px solid #ccc; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
